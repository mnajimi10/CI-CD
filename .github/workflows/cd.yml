name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:     # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read         # read the code
  packages: write        # push the image to GitHub Container Registry (ghcr.io)
  pages: write           # deploy to GitHub Pages
  id-token: write        # prove to Pages that this run is allowed to deploy

concurrency:             # one deployment at a time, never cancel one halfway
  group: cd
  cancel-in-progress: false

jobs:
  ci:                    # stage 1: the same checks as on the pull request
    uses: ./.github/workflows/ci.yml

  build:                 # stage 2: build the artifact once, tag it with the commit
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name (registry names must be lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build the image
        run: |
          docker build -t "${{ steps.name.outputs.image }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" lab

      - name: Push the image
        run: docker push "${{ steps.name.outputs.image }}"

  deploy:                # stage 3: run the exact image we built, publish its report
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages # add a "required reviewer" on this environment = manual approval
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Run the pipeline from the image
        run: |
          mkdir site
          docker run --rm -v "$PWD/site:/app/output" -e GIT_SHA="${{ github.sha }}" "${{ needs.build.outputs.image }}"

      - name: Package the website
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v5

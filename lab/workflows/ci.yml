name: CI

on:
  pull_request:          # every PR, every new commit pushed to a PR
  workflow_call:         # CD reuses this workflow as its first stage

defaults:
  run:
    working-directory: lab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -v

      - name: Run the pipeline + data quality checks
        run: python -m cafe_atlas.pipeline

      - name: Show the summary on the run page
        if: always() && hashFiles('lab/output/summary.md') != ''
        run: cat output/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report (downloadable from the run page)
        if: always() && hashFiles('lab/output/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: lab/output/
